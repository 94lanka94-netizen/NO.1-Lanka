<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanka 的个人主页</title>
    <style>
        /* 这里是 CSS，用来设计颜色和排版 */
        body {
            background-color: #fce4ec; /* 浪漫的浅粉色背景 */
            font-family: '微软雅黑', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); /* 梦幻的阴影 */
            padding: 40px;
            text-align: center;
            max-width: 400px;
        }
        img {
            width: 200px;
            border-radius: 50%; /* 把照片变成完美的圆形 */
            border: 5px solid #f8bbd0; /* 照片加个粉色边框 */
            object-fit: cover;
        }
        h1 {
            color: #d81b60; /* 深粉色字体 */
            margin-top: 20px;
        }
        p {
            color: #555;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #d81b60;
            color: white;
            text-decoration: none;
            border-radius: 30px; /* 圆角按钮 */
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 你的照片链接 -->
        <img src="https://github.com/user-attachments/assets/e7a5783e-7d48-41a7-b623-a4a0d8eb4ece" alt="我的照片">
        
        <h1>你好，我是 Lanka！</h1>
        <p>欢迎来到我的专属空间。这是我用纯手写代码搭建的。</p>
        <p>我正在努力学习 GitHub 和网页设计！</p>
        
        <!-- 一个可以点击的按钮 -->
        <a href="https://github.com/94lanka94-netizen">访问我的 GitHub</a>
    </div>

</body>
</html>
