<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Lanka 的个人主页</title>
    <style>
        body {
            background-color: #fce4ec; /* 浅粉色背景 */
            font-family: '微软雅黑', sans-serif;
            text-align: center;
            padding: 50px;
        }
        .box {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); /* 白卡片的阴影 */

        }
        img {
            width: 200px;
            border-radius: 50%; /* 圆形头像 */
            border: 5px solid #f8bbd0;
        }
        h1 { color: #d81b60; }
    </style>
</head>
<body>
    <div class="box">
        <img src="https://github.com/user-attachments/assets/e7a5783e-7d48-41a7-b623-a4a0d8eb4ece" alt="Lanka">
        <h1>Hello, 我是 Lanka！</h1>
        <p>这是我亲手写的代码，欢迎来到我的小站。</p>
    </div>
</body>
</html>
