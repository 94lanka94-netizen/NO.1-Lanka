<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanka 的个人主页</title>
    <style>
        /* 全局背景与居中设置 */
        body {
            background-color: #fce4ec; /* 浪漫的浅粉色背景 */
            font-family: '微软雅黑', 'PingFang SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        /* 白色卡片样式 */
        .card {
            background-color: white;
            border-radius: 20px; /* 圆角 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); /* 柔和阴影 */
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        /* 头像核心修复代码 */
        img {
            width: 180px;
            height: 180px;
            border-radius: 50%; /* 变成正圆 */
            border: 5px solid #f8bbd0; /* 粉色边框 */
            object-fit: cover; /* 保证图片不变形，自动裁剪填满 */
            object-position: top; /* 优先显示头部 */
            margin-bottom: 20px;
        }
        
        /* 文字样式 */
        h1 {
            color: #d81b60;
            margin: 10px 0;
            font-size: 24px;
        }
        p {
            color: #666;
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* 按钮样式 */
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 25px;
            background-color: #d81b60;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background-color 0.3s; /* 鼠标悬停动画 */
        }
        .btn:hover {
            background-color: #ad1457; /* 鼠标放上去颜色变深 */
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 这里用的是你第一张星黛露照片的链接 -->
        <img src="https://github.com/user-attachments/assets/114d4feb-346e-4d23-9aa0-a06f5b208b2a" alt="Lanka的头像">
        
        <h1>你好，我是 Lanka！</h1>
        <p>欢迎来到我的专属空间。这是我用纯手写代码搭建的第一个网页。</p>
        <p>我正在努力学习 GitHub 和网页设计，目标成为技术大牛！</p>
        
        <a href="https://github.com/94lanka94-netizen" class="btn" target="_blank">访问我的 GitHub</a>
    </div>

</body>
</html>
